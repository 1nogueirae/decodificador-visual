<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decodificador Visual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav class="navbar nav-shell">
            <div class="container-fluid">
                <a class="navbar-brand unselectable">
                    <span>&#9881;</span>
                    Decodificador Visual
                </a>
            </div>
        </nav>
    </header>


    <main>
        <div class="container app-shell">
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="card panel-card h-100">
                        <h5 class="card-header">1. Console de Entradas</h5>
                        <div class="card-body">
                            <p class="card-text">Selecione o protocolo que deseja parsear:</p>
                            <select id="protocolSelect" class="form-select" aria-label="Default select example">
                                <option selected value="0">Tipo de Protocolo</option>
                                <option value="1">Teste</option>
                                <option value="2">GT-06</option>
                            </select>
                            <p class="card-text">Cole o log bruto do equipamento aqui:</p>
                            <p class="label-muted">Exemplo para testes:</p>
                            <p class="card-text" id="log-teste"></p>
                            <textarea class="form-control" id="logTextArea" rows="7" placeholder="Cole aqui o pacote hexadecimal..."></textarea>
                            <button id="btn_translateButton" type="button" class="btn btn-secondary w-100" disabled>Traduzir</button>
                        </div>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="card panel-card h-100">
                        <h5 class="card-header">2. Tabela Parseada</h5>
                        <div class="card-body">
                            <p class="card-text">Aqui em baixo você verá uma tabela com a sua string traduzida para uma
                                tabela!
                            </p>
                            <div id="resultTable" class="table-responsive">
                                <p>Sua tabela será exibida aqui.</p>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="js/app.js"></script>

</body>

</html>
